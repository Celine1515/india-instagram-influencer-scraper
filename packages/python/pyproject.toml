[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "india-instagram-influencer-scraper"
version = "1.0.0"
description = "Client for the Indra India Instagram influencer database (Apify actor s4XRSzZuVqawl63Ih)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Celine1515", email = "celine1515@users.noreply.github.com" }]
keywords = ["instagram", "influencer", "india", "apify", "scraper"]
dependencies = ["apify-client>=1.7.0"]

[project.urls]
Homepage = "https://github.com/Celine1515/india-instagram-influencer-scraper"
Documentation = "https://celine1515.github.io/india-instagram-influencer-scraper/"
Apify = "https://apify.com/social_developer/india-instagram-influencer-scraper-modashs"

[tool.setuptools.packages.find]
include = ["india_influencer_scraper*"]
